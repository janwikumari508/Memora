<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memora - Login</title>

    <!-- Using the ONE existing CSS file -->
    <link rel="stylesheet" href="style.css">

    <!-- Prevent dark-mode flash on page load -->
    <script>
        if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark-mode");
        }
    </script>

    <!-- Inline styles only for the login form layout, no new CSS file -->
    <style>
        .login-page-body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: var(--background);
        }

        .login-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px 36px;
            width: 100%;
            max-width: 380px;
        }

        .login-box h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }

        .login-box h1 span {
            color: var(--primary);
        }

        .login-box .login-subtitle {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 28px;
        }

        .login-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .login-field label {
            font-size: 0.85rem;
            color: var(--text);
            font-weight: 500;
        }

        .login-field input {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--input);
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
        }

        .login-field input:focus {
            border-color: var(--primary);
        }

        .login-submit {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        .login-submit:hover {
            background: var(--primary-dark);
        }

        .login-switch {
            text-align: center;
            margin-top: 18px;
            font-size: 0.88rem;
            color: var(--muted);
        }

        .login-switch a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>

<body class="login-page-body">

    <div class="login-box">

        <!-- Logo -->
        <h1>MEM<span>ORA</span></h1>
        <p class="login-subtitle">Sign in to your account</p>

        <!-- Login form -->
        <form id="loginForm">

            <div class="login-field">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" placeholder="you@example.com" required>
            </div>

            <div class="login-field">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-submit">Log In</button>

        </form>

        <p class="login-switch">
            Don't have an account? <a href="#" id="showSignup">Sign Up</a>
        </p>

    </div>


    <!-- Using the ONE existing JS file -->
    <script src="script.js"></script>

    <!--
        Simple login logic — kept as plain, easy-to-explain JavaScript.
        When the form is submitted, save a flag to localStorage
        and redirect to the dashboard (index.html).
    -->
    <script>
        document.getElementById("loginForm").addEventListener("submit", function (event) {

            // Stop the browser from refreshing the page
            event.preventDefault();

            // Save the login flag to localStorage
            localStorage.setItem("memora_logged_in", "true");

            // Go to the dashboard
            window.location.href = "index.html";

        });
    </script>

</body>

</html>
